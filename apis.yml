aid: bodyspec

name: BodySpec

image: https://static.bodyspec.com/at/55/6b/556bb64891d971a6

description: BodySpec provides full-body DEXA scanning services that deliver precise body composition data, including fat, muscle, and bone density.
  Their platform offers an API and MCP access for integrating scan results into health, fitness, and AI applications, supporting bookings, pricing,
  and data retrieval for individuals and enterprises.

